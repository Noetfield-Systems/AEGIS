name: AEGIS Continuous Verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Tabler design system
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Unit and contract tests
        run: npm test
      - name: Reproduce Golden Assurance Replay twice
        run: |
          node scripts/golden-assurance-demo.mjs > /tmp/aegis-replay-a.json
          node scripts/golden-assurance-demo.mjs > /tmp/aegis-replay-b.json
          cmp /tmp/aegis-replay-a.json /tmp/aegis-replay-b.json
      - name: Reproduce synthetic federal policy impact twice
        run: |
          node scripts/policy-impact-demo.mjs > /tmp/aegis-policy-a.json
          node scripts/policy-impact-demo.mjs > /tmp/aegis-policy-b.json
          cmp /tmp/aegis-policy-a.json /tmp/aegis-policy-b.json
      - name: Verify integrated assurance reproduction
        run: |
          node scripts/integrated-assurance-demo.mjs > /tmp/aegis-integrated-1.json
          node scripts/integrated-assurance-demo.mjs > /tmp/aegis-integrated-2.json
          cmp /tmp/aegis-integrated-1.json /tmp/aegis-integrated-2.json
      - name: Verify governed lifecycle reproduction twice
        run: |
          node scripts/governed-lifecycle-demo.mjs > /tmp/aegis-governed-a.json
          node scripts/governed-lifecycle-demo.mjs > /tmp/aegis-governed-b.json
          cmp /tmp/aegis-governed-a.json /tmp/aegis-governed-b.json
      - name: Reproduce ISC Officer Evidence Pack twice (synthetic-only)
        run: |
          node scripts/officer-evidence-pack.mjs > /tmp/aegis-officer-a.json
          node scripts/officer-evidence-pack.mjs > /tmp/aegis-officer-b.json
          cmp /tmp/aegis-officer-a.json /tmp/aegis-officer-b.json
          mkdir -p artifacts/officer-evidence
          cp /tmp/aegis-officer-a.json artifacts/officer-evidence/aegis-officer-pack-synthetic.json
      - name: Check JS syntax
        run: |
          node --check server.mjs
          node --check security/auth.mjs
          node --check assurance/officer-pack.mjs
          node --check scripts/officer-evidence-pack.mjs
          node --check model.mjs
          node --check assurance/native.mjs
          node --check assurance/replay.mjs
          node --check assurance/policy.mjs
          node --check assurance/integrated.mjs
          node --check assurance/benchmark.mjs
          node --check assurance/aia-scope.mjs
          node --check assurance/source-registry.mjs
          node --check assurance/governed-lifecycle.mjs
          node --check assurance/advanced-native.mjs
          node --check public/tour.js
          node --check public/workbench.js
          node --check public/theme.js
          node --check scripts/browser-quality.mjs
          node --check assurance/integrated-report.mjs
          node --check assurance/impact-experiment.mjs
          node --check fixtures/impact-experiment.mjs
          node --check fixtures/scenario-library.mjs
          node --check fixtures/governed.mjs
          node --check scripts/governed-lifecycle-demo.mjs
          node --check assurance/review-journal.mjs
          node --check fixtures/integrated.mjs
          node --check scripts/integrated-assurance-demo.mjs
          node --check fixtures/policy-impact.mjs
          node --check scripts/policy-impact-demo.mjs
          node --check fixtures/golden.mjs
          node --check scripts/golden-assurance-demo.mjs
          node --check public/app.js
          node --check public/locale.js
          node --check scripts/daily-operations.mjs
      - name: Real Chromium EN/FR user and mobile journey
        run: node scripts/browser-quality.mjs
      - name: Preserve synthetic-only browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aegis-browser-quality-${{ github.run_id }}
          path: artifacts/browser-quality/*.png
          retention-days: 14
          if-no-files-found: ignore
      - name: Preserve executable ISC Officer Evidence Pack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aegis-isc-officer-evidence-${{ github.run_id }}
          path: artifacts/officer-evidence/*.json
          retention-days: 30
          if-no-files-found: error
      - name: Check required source assets
        run: |
          test -s assurance/native.mjs
          test -s public/premium.css
          test -s docs/PRODUCT_SSOT.md
          test -s docs/COMPANY_OS.md
          test -s ops/backlog.json
